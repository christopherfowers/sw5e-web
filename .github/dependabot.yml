version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  # Both base images in the Dockerfile. Node is pinned to the exact version in
  # .nvmrc, so a bump here has to be matched there and in the README before it
  # can be merged.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
