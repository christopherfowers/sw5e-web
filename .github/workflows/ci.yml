name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Audit dependencies
        run: npm audit --audit-level=high

  # The container is not built anywhere else before it is released, so this is
  # the only place the Dockerfile and the nginx config are exercised. It builds
  # the image without pushing, then runs it and checks the routing rules that
  # nothing else can catch: a prerendered page must answer with its own markup
  # rather than with the SPA shell.
  #
  # It is also the only place that can catch the image rendering the wrong
  # dataset. The Dockerfile builds the site from the canonical content image,
  # and a failed copy or a reverted generator would fall back to the committed
  # four-per-type fixture without erroring, so the assertions below compare
  # what the container actually publishes against the content it was built
  # from.
  image:
    name: Container image
    runs-on: ubuntu-latest
    env:
      # The one place the content revision is named. Both the build and the
      # assertions read it, so they can never check the site against a
      # different content set than the one it was built from.
      SW5E_CONTENT_IMAGE: ghcr.io/christopherfowers/sw5e-database
      SW5E_CONTENT_TAG: latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: sw5e-web:ci
          build-args: |
            SW5E_CONTENT_TAG=${{ env.SW5E_CONTENT_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Take the canonical content the image was built from
        run: |
          docker create --name sw5e-content \
            "$SW5E_CONTENT_IMAGE:$SW5E_CONTENT_TAG" > /dev/null
          docker cp sw5e-content:/opt/sw5e/content ./canonical-content
          docker rm sw5e-content > /dev/null
          find canonical-content -name '*.json' | wc -l

      - name: Start container
        run: |
          docker run --detach --name sw5e-web --publish 8080:8080 sw5e-web:ci
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/healthz > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "the container never became healthy"
          docker logs sw5e-web
          exit 1

      - name: The rendered catalogue is the canonical one, not the fixture
        run: |
          # This is the assertion the whole job exists for. The site used to
          # ship the committed fixture — four species — while the API served
          # the canonical set, and nothing failed. A count that is merely
          # "more than zero" would pass on both, so this compares the rendered
          # index against the content the image was built from, and refuses
          # anything at or below fixture size outright.
          canonical=$(ls canonical-content/species/*.json | wc -l)
          rendered=$(curl --fail --silent http://127.0.0.1:8080/species \
            | grep -o 'href="/species/[a-z0-9-]*"' | sort -u | wc -l)

          echo "canonical species: $canonical, rendered species: $rendered"

          # An absolute floor as well as the derived count: if the content
          # image itself ever shrank, the two numbers would still agree, and
          # this job must not agree with a fixture-sized catalogue.
          if [ "$canonical" -lt 14 ]; then
            echo "the canonical content set has shrunk to $canonical species"
            exit 1
          fi
          if [ "$rendered" -ne "$canonical" ]; then
            echo "the image renders $rendered species; the content it was" \
              "built from has $canonical. A fixture-sized catalogue (4) means" \
              "the canonical content never reached the build."
            exit 1
          fi

      - name: Every canonical item is prerendered as its own route
        run: |
          # One page per document, plus the home page, the search page, the
          # sources index, four source pages and eight type indexes. The
          # canonical set has no maneuvers, and `feature` and `source` are not
          # browsable types, so only the seven mapped directories contribute
          # item pages.
          items=0
          for type in species archetype background feat power equipment monster; do
            items=$((items + $(ls "canonical-content/$type"/*.json | wc -l)))
          done
          expected=$((items + 15))

          rendered=$(docker exec sw5e-web \
            find /usr/share/nginx/html -name index.html | wc -l)

          echo "expected $expected prerendered routes, found $rendered"
          if [ "$rendered" -ne "$expected" ]; then
            echo "the prerendered route count does not match the canonical set"
            exit 1
          fi

      - name: A type with no canonical content still has an index page
        run: |
          # The canonical set carries no maneuvers. The type keeps its place
          # in the site's navigation, so its index has to exist and render
          # rather than 404 on a link the header offers.
          body=$(curl --fail --silent http://127.0.0.1:8080/maneuvers)
          grep -q '<h1>Maneuvers</h1>' <<< "$body"
          grep -q 'No maneuvers in this build' <<< "$body"

      - name: A prerendered content page serves its own markup
        run: |
          # Taken from the canonical content the image was built from rather
          # than hard-coded, so this keeps working as the content set grows.
          # The slug is derived the same way the generator derives it: the
          # display name, lowercased, with every run of other characters
          # collapsed to a hyphen.
          name=$(jq -r .name canonical-content/species/*.json | sort | head -1)
          slug=$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')

          body=$(curl --fail --silent "http://127.0.0.1:8080/species/$slug")

          # nginx has to resolve /species/<slug> to species/<slug>/index.html
          # before reaching for the SPA fallback. If it falls back instead, the
          # response is the shell: still a 200, still fine once JavaScript
          # runs, and completely empty to a crawler that does not run it.
          if ! grep -q "<h1>$name</h1>" <<< "$body"; then
            echo "expected the prerendered <h1>$name</h1>; got the SPA shell"
            exit 1
          fi

      - name: A prerendered index page serves its own markup
        run: |
          curl --fail --silent http://127.0.0.1:8080/species | grep -q "<h1>Species</h1>"

      - name: The home page serves its own markup
        run: |
          curl --fail --silent http://127.0.0.1:8080/ | grep -q "<h1>Star Wars 5e</h1>"

      - name: A single-fetch payload is served next to its route
        run: |
          name=$(jq -r .name canonical-content/species/*.json | sort | head -1)
          slug=$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')
          curl --fail --silent --head "http://127.0.0.1:8080/species/$slug.data" > /dev/null

      - name: An unpublished path answers 404 with the app shell
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:8080/not-a-published-path)
          if [ "$status" != "404" ]; then
            echo "expected 404 for an unpublished path, got $status"
            exit 1
          fi

      - name: Assets are immutable and HTML is not
        run: |
          asset=$(curl --fail --silent http://127.0.0.1:8080/ \
            | grep -o '/assets/[A-Za-z0-9._-]*\.css' | head -1)
          curl --fail --silent --head "http://127.0.0.1:8080$asset" \
            | grep -qi 'cache-control: public, max-age=31536000, immutable'
          curl --fail --silent --head http://127.0.0.1:8080/ \
            | grep -qi 'cache-control: no-cache'

      - name: Security headers are present and name no external origin
        run: |
          headers=$(curl --fail --silent --head http://127.0.0.1:8080/)
          grep -qi 'content-security-policy:' <<< "$headers"
          grep -qi 'x-content-type-options: nosniff' <<< "$headers"
          grep -qi 'referrer-policy:' <<< "$headers"
          grep -qi 'x-frame-options: DENY' <<< "$headers"

          # The project rule is that nothing is loaded from a third party, so
          # no host may appear in the policy at all.
          csp=$(grep -i 'content-security-policy:' <<< "$headers")
          if grep -qiE '(https?:)?//[a-z0-9.-]+' <<< "$csp"; then
            echo "the CSP names an external origin: $csp"
            exit 1
          fi

          # nginx must not advertise its version.
          if grep -qiE '^server: nginx/' <<< "$headers"; then
            echo "server_tokens is not off"
            exit 1
          fi

      - name: Container runs as a non-root user on 8080
        run: |
          uid=$(docker exec sw5e-web id -u)
          if [ "$uid" = "0" ]; then
            echo "the container is running as root"
            exit 1
          fi

      - name: Container logs
        if: always()
        run: docker logs sw5e-web || true

      - name: Stop container
        if: always()
        run: docker rm --force sw5e-web || true
