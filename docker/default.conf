# Static hosting for the prerendered sw5e-web build.
#
# Included by the stock nginx-unprivileged nginx.conf, which already declares
# `user nginx`, keeps the pid file and the temp paths under /tmp, and pulls
# this file into the http{} context — so the map{} below is legal here.
#
# TLS terminates at the Traefik in front of this container, so nothing here
# listens on 443, redirects to https, or sets Strict-Transport-Security. HSTS
# is a property of the origin the browser actually talks to and belongs on the
# proxy; setting it from behind the proxy would put this container in charge of
# a policy it cannot see the effects of.

# Cache-Control is derived from the request path here rather than set with
# add_header inside per-path locations, because nginx *replaces* rather than
# merges add_header sets: a `location /assets/` carrying its own Cache-Control
# would silently drop every security header inherited from the server block.
# Keeping every add_header together at server level makes that impossible.
map $uri $sw5e_cache_control {
    # Everything Vite emits under /assets/ carries a content hash in its file
    # name, so changed content always means a changed URL. Nothing here can go
    # stale, so it can be cached for as long as the browser is willing to.
    ~^/assets/  "public, max-age=31536000, immutable";

    # Everything else — the prerendered HTML, the .data payloads, favicon.ico —
    # keeps the same URL across deploys. It has to be revalidated on every
    # request or a release would not reach a returning visitor until their
    # cache expired. "no-cache" still allows a 304, it just forbids serving
    # from cache without asking.
    default     "no-cache";
}

server {
    # nginx-unprivileged's own default. IPv4 only: binding [::] fails outright
    # on a host with IPv6 disabled, and Traefik reaches this container over the
    # compose network.
    #
    # The image's 10-listen-on-ipv6-by-default.sh would otherwise add a
    # `listen [::]:8080` here, and logs an "info: can not modify ... (read-only
    # file system?)" line on startup when it finds this file owned by root. That
    # message is expected and is not an error: the file is deliberately not
    # writable by the user nginx runs as.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # This container never sees its public hostname or scheme, so it must never
    # try to build an absolute URL out of what it does see.
    absolute_redirect off;
    port_in_redirect off;

    # --- Response headers --------------------------------------------------
    #
    # There is no _headers file and no meta-tag policy in app/root.tsx to
    # reproduce: the app's policy today is expressed as an absence. Inter is
    # self-hosted from app/fonts (app/root.tsx, app/app.css), images and the
    # search index are bundled into /assets, and e2e/self-hosted-fonts.spec.ts
    # fails the build if any request leaves this origin. This CSP is that rule
    # written down — every fetch directive is 'self' and no external host
    # appears anywhere in it.
    #
    # 'unsafe-inline' in script-src is the one concession, and it is forced:
    # React Router's prerendered HTML embeds its hydration state and route
    # manifest in inline <script> elements, and static files cannot carry a
    # per-response nonce. Removing it would leave every page unhydrated.
    # style-src needs no such concession — the build emits stylesheets as
    # files and there is not one inline style attribute in the output.
    #
    # `always` so the headers are present on error responses too, including the
    # 404s that the SPA fallback below answers with.
    add_header Cache-Control $sw5e_cache_control always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    # frame-ancestors above is the directive browsers actually honour; this is
    # kept for the ones that still only understand the older header.
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # `publickey-credentials-create` and `publickey-credentials-get` are the
    # two exceptions to the deny-everything rule above, and they have to be:
    # they are the permissions that gate `navigator.credentials.create()` and
    # `.get()` for WebAuthn, which is how this site's accounts are secured.
    #
    # `publickey-credentials-get=()` was here until passkeys landed, and it
    # would have broken sign-in in production only — the browser refuses the
    # ceremony with the same opaque NotAllowedError a reader gets for
    # dismissing the prompt, so it looks like every visitor cancelling. Local
    # development, `vite preview` and the e2e suite all serve without this
    # header and would never have shown it.
    #
    # `(self)` rather than `*`: this origin may run the ceremony, and no frame
    # from anywhere else may run one on its behalf. frame-ancestors 'none'
    # already forbids being framed at all, so this is the second lock on the
    # same door.
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-create=(self), publickey-credentials-get=(self), screen-wake-lock=(), usb=(), xr-spatial-tracking=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # --- Compression -------------------------------------------------------
    #
    # gzip only: the nginx-unprivileged image is the stock nginx build and
    # carries no brotli module, so referencing one here would stop nginx from
    # starting. text/html is always compressed and cannot be listed. The webp
    # images and woff2 fonts that make up most of /assets are already
    # compressed and are deliberately left out.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml;

    # --- Routing -----------------------------------------------------------

    # For the HEALTHCHECK and for a compose healthcheck or a Traefik service
    # check. Deliberately not an add_header location: it inherits the header
    # set above rather than replacing it.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Content-hashed build output. Kept out of the SPA fallback below: a
    # request for an asset that a previous deploy owned should fail as a 404,
    # not quietly answer with an HTML shell that the browser will then try to
    # parse as JavaScript.
    location /assets/ {
        try_files $uri =404;
    }

    # React Router's single-fetch payloads, written next to each prerendered
    # route as `<route>.data`. They are turbo-stream-encoded JSON; the client
    # never inspects the content type, but declaring it keeps them out of
    # application/octet-stream and inside gzip_types. A missing payload must
    # 404 so the client raises a route error, rather than receiving HTML that
    # fails to decode.
    location ~ \.data$ {
        default_type application/json;
        try_files $uri =404;
    }

    location / {
        # This ordering is the whole point of the file, and it mirrors
        # serveDirectoryIndexBeforeSpaFallback() in vite.config.ts:
        #
        #   1. $uri            — an exact file: /assets/..., /favicon.ico,
        #                        /species/wookiee.data.
        #   2. $uri/index.html — the directory-index lookup. This is what
        #                        resolves /species/wookiee to the prerendered
        #                        species/wookiee/index.html, and it MUST come
        #                        before the fallback. Reach for the fallback
        #                        first and every content page answers with an
        #                        empty SPA shell instead of its own markup:
        #                        the page still looks right once JavaScript
        #                        runs, so nothing visibly breaks, while every
        #                        crawler that does not execute JavaScript sees
        #                        nothing at all.
        #   3. the fallback    — only for paths that were never prerendered.
        #
        # A path that was never prerendered does not exist on this site: the
        # prerender list in react-router.config.ts covers every published
        # route. So the shell is served through error_page, which keeps the
        # 404 status while still handing the client enough to render the app's
        # own "Page not found" view. `vite preview` answers 200 there; a soft
        # 200 on a nonexistent URL is the one behaviour of the preview server
        # worth not reproducing.
        error_page 404 /__spa-fallback.html;
        try_files $uri $uri/index.html =404;
    }
}
